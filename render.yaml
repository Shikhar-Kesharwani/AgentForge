services:
  - type: web
    name: agentforge-backend
    env: docker
    dockerfilePath: ./backend.Dockerfile
    plan: free
    autoDeploy: true
    envVars:
      - key: API_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PINECONE_API_KEY
        sync: false
