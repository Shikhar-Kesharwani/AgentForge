version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - API_KEY=default-dev-key
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # Leaving DATABASE_URL and PINECONE_API_KEY blank here triggers the local SQLite/ChromaDB fallback
    volumes:
      # Mount the workspace and memory_db so data persists locally across container restarts
      - ./workspace:/app/workspace
      - ./memory_db:/app/memory_db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
